name: Validate reusable UI components

on:
  pull_request:
    paths:
      - "components/**"
      - ".github/workflows/components-check.yml"
  push:
    branches: [main]
    paths:
      - "components/**"
      - ".github/workflows/components-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check component JavaScript syntax
        run: npm --prefix components run check
      - name: Check demo, types and image references
        run: node components/tests/smoke.mjs
